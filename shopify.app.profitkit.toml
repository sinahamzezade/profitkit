# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5243e677cda81e9c8dfa6e51b776a966"
name = "profitkit"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  # Mandatory privacy webhooks — an App Store review requirement, not optional.
  # These are NOT ordinary subscriptions: Shopify rejects customers/data_request,
  # customers/redact and shop/redact as topics. They belong in their own block,
  # declared before the subscriptions array so the table nesting stays unambiguous.
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Margin data. Orders and refunds drive every figure; products keep titles,
  # vendors and native costs current — vendor matters because it is a rung of
  # the cost ladder, not just a label.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = [ "orders/create", "orders/updated" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,read_inventory"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
